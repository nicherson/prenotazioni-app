<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Prenotazioni Online</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- COLLEGAMENTO AL CSS -->
  <link rel="stylesheet" href="styles.css">
</head>
  <script src="script.js"></script>
<body>

<header class="header">
  <img src="https://via.placeholder.com/120x60?text=LOGO" alt="Logo azienda">
  <p>Prenota il tuo appuntamento online</p>
</header>

<div class="container">

  <h2>Seleziona il servizio</h2>
  <div class="services">
    <div class="service">
      <img src="https://via.placeholder.com/100" alt="">
      <span>Tagliando</span>
    </div>
    <div class="service">
      <img src="https://via.placeholder.com/100" alt="">
      <span>Revisione</span>
    </div>
    <div class="service">
      <img src="https://via.placeholder.com/100" alt="">
      <span>Cambio Gomme</span>
    </div>
  </div>

  <h2>Seleziona data</h2>
  <input type="date">

  <h2>Seleziona orario</h2>
  <div class="times">
    <div>09:00</div>
    <div>10:00</div>
    <div>11:00</div>
    <div>14:00</div>
  </div>

  <h2>Dati cliente</h2>
  <input placeholder="Nome">
  <input placeholder="Cognome">
  <input placeholder="Targa veicolo">
  <input placeholder="Km veicolo">

  <button>Conferma prenotazione</button>

</div>

<script src="script.js"></script>
</body>
