<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Prenotazioni Online</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- COLLEGAMENTO AL CSS -->
  <link rel="stylesheet" href="styles.css">
</head>
  <script src="script.js"></script>
<body>

<header class="header">
  <img src="https://via.placeholder.com/120x60?text=LOGO" alt="Logo azienda">
  <p>Prenota il tuo appuntamento online</p>
</header>

<div class="container" id="booking">

  <h2>Seleziona il servizio</h2>
  <div class="services">
    <div class="service">
      <img src="https://via.placeholder.com/100">
      <span>Tagliando</span>
    </div>
    <div class="service">
      <img src="https://via.placeholder.com/100">
      <span>Revisione</span>
    </div>
    <div class="service">
      <img src="https://via.placeholder.com/100">
      <span>Cambio Gomme</span>
    </div>
  </div>

  <h2>Seleziona data</h2>
  <input type="date" id="date">

  <h2>Seleziona orario</h2>
  <div class="times">
    <div>09:00</div>
    <div>10:00</div>
    <div>11:00</div>
    <div>14:00</div>
  </div>

  <h2>Dati cliente</h2>
  <input id="nome" placeholder="Nome">
  <input id="cognome" placeholder="Cognome">
  <input id="targa" placeholder="Targa veicolo">
  <input id="km" placeholder="Km veicolo">

  <button id="confirmBtn">Conferma prenotazione</button>
</div>

<!-- SCHERMATA FINALE -->
<div class="container hidden" id="success">
  <h2>✅ Prenotazione confermata</h2>
  <p>Grazie per aver prenotato.</p>

  <div class="summary">
    <p><strong>Servizio:</strong> <span id="sService"></span></p>
    <p><strong>Data:</strong> <span id="sDate"></span></p>
    <p><strong>Orario:</strong> <span id="sTime"></span></p>
  </div>
</div>
